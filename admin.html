<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ReferPay admin</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#14181f;--muted:#6a7280;--accent:#0f9d6b;--accent-t:#fff;--line:#e3e6eb;--err:#c0392b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#1a1f26;--text:#eef1f5;--muted:#9aa3b0;--accent:#27c58e;--accent-t:#06150e;--line:#2a313b;--err:#ff7b6b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:6px 0 10px}h2{font-size:16px;margin:18px 0 8px}
p{margin:0 0 8px;color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card b{color:var(--text)}
textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;margin-bottom:10px;resize:vertical}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;margin-bottom:10px}
button{padding:12px 14px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-t);font:inherit;font-weight:600;cursor:pointer}
button.alt{background:transparent;color:var(--text);border:1px solid var(--line)}button:disabled{opacity:.5}
.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1}
.big{font-size:20px;font-weight:700;color:var(--accent)}.err{color:var(--err)}
</style>
</head>
<body>
<main id="app"></main>
<script>
const $ = (id) => document.getElementById(id);
const money = (p) => "GH₵" + (p / 100).toFixed(2);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let KEY = ""; try { KEY = localStorage.getItem("rp_admin") || ""; } catch (e) {}
let timer = null, lastData = "";

async function call(path, method, body) {
  const r = await fetch("/api/admin" + path, { method: method || "GET", headers: { "x-admin-key": KEY, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Request failed (" + r.status + ")");
  return j;
}

function loginView(msg) {
  clearInterval(timer);
  $("app").innerHTML = `<h1>ReferPay admin</h1><div class="card"><p>Enter your admin key.</p>
  <input id="k" type="password" placeholder="Admin key" autocomplete="off"><p class="err" id="e">${esc(msg || "")}</p>
  <button id="go" style="width:100%">Open</button></div>`;
  $("go").onclick = () => { KEY = $("k").value.trim(); try { localStorage.setItem("rp_admin", KEY); } catch (e) {} load(); };
}

async function load(force) {
  let d;
  try { d = await call("/pending"); d.announcements = await call("/announcements"); } catch (e) { return loginView(e.message === "Forbidden" ? "Wrong admin key." : e.message); }
  const sig = JSON.stringify(d);
  if (sig === lastData && $("rf") && !force) return; // nothing new: leave the screen (and your scroll position) alone
  lastData = sig;
  const draft = $("ann") ? $("ann").value : ""; // keep anything you were typing
  $("app").innerHTML = `<h1>ReferPay admin</h1>
  <button class="alt" id="rf" style="width:100%">Refresh</button>
  <h2>Payments to confirm (${d.signups.length})</h2>
  ${d.signups.length ? d.signups.map((s) => `<div class="card"><div class="big">${money(s.amount)}</div>
    <p><b>${esc(s.name)}</b><br>MoMo ${esc(s.phone)} (${esc(s.network)})<br>Reference ${esc(s.reference)}<br>Transaction ID <b>${esc(s.txn_id)}</b></p>
    <p>Check your MoMo app: the money and this transaction ID must be there before you approve.</p>
    <div class="row"><button data-a="approve" data-id="${s.id}" data-t="${esc(s.name)} / ${money(s.amount)} / ID ${esc(s.txn_id)}">Approve</button><button class="alt" data-a="reject-s" data-id="${s.id}">Reject</button></div></div>`).join("") : "<p>Nothing waiting.</p>"}
  <h2>Withdrawals to send (${d.payouts.length})</h2>
  ${d.payouts.length ? d.payouts.map((p) => `<div class="card"><div class="big">Send ${money(p.amount - p.fee)}</div>
    <p><b>${esc(p.name)}</b><br>MoMo ${esc(p.phone)} (${esc(p.network)})<br>Requested ${money(p.amount)}, minus ${money(p.fee)} fee</p>
    <p>Send it from your MoMo first, then tap Mark as paid.</p>
    <div class="row"><button data-a="paid" data-id="${p.id}" data-t="${money(p.amount - p.fee)} to ${esc(p.name)} ${esc(p.phone)}">Mark as paid</button><button class="alt" data-a="reject-p" data-id="${p.id}">Reject and refund</button></div></div>`).join("") : "<p>Nothing waiting.</p>"}
  <h2>Announcements to members</h2>
  <div class="card"><textarea id="ann" rows="4" maxlength="500" placeholder="Write a message for all members"></textarea>
    <p>Shown at the top of every member's Home page. Up to 500 characters.</p>
    <button id="post" style="width:100%">Post announcement</button><p class="err" id="e2"></p></div>
  ${d.announcements.length ? d.announcements.map((n) => `<div class="card"><p style="white-space:pre-wrap;color:var(--text)">${esc(n.message)}</p><p>${esc(String(n.created).slice(0, 10))}</p>
    <button class="alt" data-a="del-a" data-id="${n.id}">Delete</button></div>`).join("") : "<p>No announcements yet.</p>"}
  <p style="margin-top:16px"><a href="#" id="lo" style="color:var(--muted)">Log out</a></p><p class="err" id="e"></p>`;
  $("ann").value = draft;
  $("post").onclick = async () => {
    const msg = $("ann").value.trim();
    if (!msg) { $("e2").textContent = "Write a message first."; return; }
    $("post").disabled = true;
    try { await call("/announcements", "POST", { message: msg }); $("ann").value = ""; await load(true); }
    catch (e) { $("e2").textContent = e.message; $("post").disabled = false; }
  };
  $("rf").onclick = () => load(true);
  $("lo").onclick = (ev) => { ev.preventDefault(); KEY = ""; try { localStorage.removeItem("rp_admin"); } catch (e) {} loginView(); };
  document.querySelectorAll("button[data-a]").forEach((b) => { b.onclick = () => act(b); });
  clearInterval(timer); timer = setInterval(() => load(), 30000);
}

async function act(b) {
  const a = b.dataset.a, id = b.dataset.id;
  const ask = { approve: "Did this arrive in your MoMo app?\n" + (b.dataset.t || ""), paid: "Have you already sent " + (b.dataset.t || "") + "?",
    "reject-s": "Reject this payment? The person is NOT activated. Refund them yourself if they did pay.", "reject-p": "Reject this withdrawal? The money goes back to the member's balance.", "del-a": "Delete this announcement? Members will no longer see it." }[a];
  if (!confirm(ask)) return;
  b.disabled = true;
  const path = { approve: "/signups/" + id + "/approve", "reject-s": "/signups/" + id + "/reject", paid: "/payouts/" + id + "/paid", "reject-p": "/payouts/" + id + "/reject", "del-a": "/announcements/" + id + "/delete" }[a];
  try { await call(path, "POST"); await load(true); } catch (e) { b.disabled = false; $("e").textContent = e.message; }
}

if (KEY) load(); else loginView();
</script>
</body>
</html>
